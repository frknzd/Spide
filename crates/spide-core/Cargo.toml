[package]
name = "spide-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.8"
thiserror = "2"
resvg = "0.50"
svg2pdf = "0.13"
# same version resvg/tiny-skia use (already in the lockfile): PNG with a pHYs (dpi) chunk
png = "0.18"

[dev-dependencies]
tempfile = "3"
