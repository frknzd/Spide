[package]
name = "spide-headless"
version.workspace = true
edition.workspace = true

[dependencies]
spide-core = { path = "../spide-core" }
spide-service = { path = "../spide-service" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
axum = "0.8"

[dev-dependencies]
rmpv = "1"
tempfile = "3"
