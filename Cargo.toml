[workspace]
resolver = "2"
members = ["crates/spide-core", "crates/spide-import", "crates/spide-diagram", "crates/spide-service", "crates/spide-lsp", "crates/spide-headless", "app"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# The metrics engine runs on every change (and per decision option): keep it fast in dev builds too.
[profile.dev.package.spide-core]
opt-level = 2
[profile.dev.package.spide-diagram]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
