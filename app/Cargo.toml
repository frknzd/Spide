[package]
name = "spide"
version.workspace = true
edition.workspace = true

[dependencies]
spide-core = { path = "../crates/spide-core" }
spide-import = { path = "../crates/spide-import" }
spide-diagram = { path = "../crates/spide-diagram" }
spide-service = { path = "../crates/spide-service" }
eframe = { version = "0.37", features = ["persistence"] }
epaint = { version = "0.37", features = ["color_fonts"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
rfd = "0.18"
arboard = { version = "3", default-features = false, features = ["image-data"] }

alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
notify = "8"
dirs = "6"
portable-pty = "0.9"
tempfile = "3"
libc = "0.2"
spide-lsp = { version = "0.1.0", path = "../crates/spide-lsp" }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu", "eframe"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
winit = { version = "0.30.13", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSObject", "NSString"] }
